# Generated workspace ownership rules are written here by the monitor manager.
source = ~/.config/hypr/workspace-monitors.generated.conf

# Keep both native GTK applications warm and react to monitor hotplug events.
exec-once = ~/.local/bin/workspace-field --daemon
exec-once = ~/.local/bin/workspace-display-manager --daemon

# Open the 10x10 field. The display-layout GUI intentionally has no keybind;
# launch "Workspace Display Layout" from Walker or another desktop launcher.
bindd = SUPER, Q, Workspace field, exec, ~/.local/bin/workspace-field

# Main axis: switch every connected display to its remembered sub-workspace.
bind = SUPER, 1, exec, ~/.config/hypr/set_main.sh 1
bind = SUPER, 2, exec, ~/.config/hypr/set_main.sh 2
bind = SUPER, 3, exec, ~/.config/hypr/set_main.sh 3
bind = SUPER, 4, exec, ~/.config/hypr/set_main.sh 4
bind = SUPER, 5, exec, ~/.config/hypr/set_main.sh 5
bind = SUPER, 6, exec, ~/.config/hypr/set_main.sh 6
bind = SUPER, 7, exec, ~/.config/hypr/set_main.sh 7
bind = SUPER, 8, exec, ~/.config/hypr/set_main.sh 8
bind = SUPER, 9, exec, ~/.config/hypr/set_main.sh 9
bind = SUPER, 0, exec, ~/.config/hypr/set_main.sh 10

# Sub axis: route to the display that owns the requested sub-workspace.
bind = SUPER CTRL, 1, exec, ~/.config/hypr/goto_sub.sh 1
bind = SUPER CTRL, 2, exec, ~/.config/hypr/goto_sub.sh 2
bind = SUPER CTRL, 3, exec, ~/.config/hypr/goto_sub.sh 3
bind = SUPER CTRL, 4, exec, ~/.config/hypr/goto_sub.sh 4
bind = SUPER CTRL, 5, exec, ~/.config/hypr/goto_sub.sh 5
bind = SUPER CTRL, 6, exec, ~/.config/hypr/goto_sub.sh 6
bind = SUPER CTRL, 7, exec, ~/.config/hypr/goto_sub.sh 7
bind = SUPER CTRL, 8, exec, ~/.config/hypr/goto_sub.sh 8
bind = SUPER CTRL, 9, exec, ~/.config/hypr/goto_sub.sh 9
bind = SUPER CTRL, 0, exec, ~/.config/hypr/goto_sub.sh 10

# Move the active window on either axis.
bind = SUPER SHIFT, 1, exec, ~/.config/hypr/move_to_main.sh 1
bind = SUPER SHIFT, 2, exec, ~/.config/hypr/move_to_main.sh 2
bind = SUPER SHIFT, 3, exec, ~/.config/hypr/move_to_main.sh 3
bind = SUPER SHIFT, 4, exec, ~/.config/hypr/move_to_main.sh 4
bind = SUPER SHIFT, 5, exec, ~/.config/hypr/move_to_main.sh 5
bind = SUPER SHIFT, 6, exec, ~/.config/hypr/move_to_main.sh 6
bind = SUPER SHIFT, 7, exec, ~/.config/hypr/move_to_main.sh 7
bind = SUPER SHIFT, 8, exec, ~/.config/hypr/move_to_main.sh 8
bind = SUPER SHIFT, 9, exec, ~/.config/hypr/move_to_main.sh 9
bind = SUPER SHIFT, 0, exec, ~/.config/hypr/move_to_main.sh 10

bind = SUPER SHIFT CTRL, 1, exec, ~/.config/hypr/move_to_sub.sh 1
bind = SUPER SHIFT CTRL, 2, exec, ~/.config/hypr/move_to_sub.sh 2
bind = SUPER SHIFT CTRL, 3, exec, ~/.config/hypr/move_to_sub.sh 3
bind = SUPER SHIFT CTRL, 4, exec, ~/.config/hypr/move_to_sub.sh 4
bind = SUPER SHIFT CTRL, 5, exec, ~/.config/hypr/move_to_sub.sh 5
bind = SUPER SHIFT CTRL, 6, exec, ~/.config/hypr/move_to_sub.sh 6
bind = SUPER SHIFT CTRL, 7, exec, ~/.config/hypr/move_to_sub.sh 7
bind = SUPER SHIFT CTRL, 8, exec, ~/.config/hypr/move_to_sub.sh 8
bind = SUPER SHIFT CTRL, 9, exec, ~/.config/hypr/move_to_sub.sh 9
bind = SUPER SHIFT CTRL, 0, exec, ~/.config/hypr/move_to_sub.sh 10
