name: build

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make pkg-config libgtk-3-dev libjson-glib-dev zsh ripgrep
      - name: Build and test
        run: make test
